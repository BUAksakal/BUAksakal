<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="104" viewBox="0 0 1200 104" role="img" aria-label="What I&#x27;m building"><title>What I&#x27;m building</title><style>@font-face{font-family:'x-serif';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'x-serifi';src:url(data:font/woff;base64,) format('woff')}text{font-synthesis:none;font-kerning:normal}*{transform-box:fill-box;transform-origin:center}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes flash{0%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}65%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes swing{0%{opacity:0;transform:translateY(150px) rotate(-8deg)}55%{opacity:1;transform:translateY(-12px) rotate(1.6deg)}78%{transform:translateY(4px) rotate(-.5deg)}100%{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.65;transform:scale(1)}100%{opacity:0;transform:scale(4)}}
@keyframes nudge{0%,72%,100%{transform:none}82%{transform:translateX(6px)}91%{transform:translateX(-1px)}}
@keyframes sweep{0%{transform:translateX(-260px) skewX(-18deg)}22%,100%{transform:translateX(560px) skewX(-18deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.m{display:none}}</style><defs></defs><g style="animation:up 0.700s cubic-bezier(.2,.75,.2,1) 3.700s both;"><text x="48.0" y="76.0" font-family="x-serif" font-size="46" fill="#F1F0EC" text-anchor="start" xml:space="preserve">What I&#x27;m </text><text x="200.0" y="76.0" font-family="x-serifi" font-size="46" fill="#F1F0EC" text-anchor="start" xml:space="preserve">building</text></g></svg>