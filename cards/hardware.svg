<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="HARDWARE: B.Sc. EEE"><title>HARDWARE: B.Sc. EEE</title><style>@font-face{font-family:'x-mono';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'x-sans';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'x-serif';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'x-serifi';src:url(data:font/woff;base64,) format('woff')}text{font-synthesis:none;font-kerning:normal}*{transform-box:fill-box;transform-origin:center}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes flash{0%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}65%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes swing{0%{opacity:0;transform:translateY(150px) rotate(-8deg)}55%{opacity:1;transform:translateY(-12px) rotate(1.6deg)}78%{transform:translateY(4px) rotate(-.5deg)}100%{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.65;transform:scale(1)}100%{opacity:0;transform:scale(4)}}
@keyframes nudge{0%,72%,100%{transform:none}82%{transform:translateX(6px)}91%{transform:translateX(-1px)}}
@keyframes sweep{0%{transform:translateX(-260px) skewX(-18deg)}22%,100%{transform:translateX(560px) skewX(-18deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.m{display:none}}</style><defs><clipPath id="clip"><rect x="8" y="8" width="384" height="284" rx="22"/></clipPath></defs><g clip-path="url(#clip)"><g style="transform-origin:50% 100%;animation:swing 1.050s cubic-bezier(.3,.7,.3,1) 3.000s both;"><rect x="8" y="8" width="384" height="284" rx="22" fill="#3854F6"/><rect class="m" x="0" y="-40" width="70" height="380" fill="#FFFFFF" opacity=".16" style="transform:translateX(-260px);animation:sweep 6s ease-in-out 4.40s infinite"/><text x="40.0" y="66.0" font-family="x-mono" font-size="16" fill="#FFFFFF" text-anchor="start" xml:space="preserve" letter-spacing="2.4">HARDWARE</text><path d="M343.0 60.0H359.0M353.0 54.0L359.0 60.0L353.0 66.0" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="animation:nudge 3.200s ease-in-out 4.200s infinite;"/><circle class="m" cx="352" cy="60" r="12" fill="none" stroke="#FFFFFF" stroke-width="1.5" style="opacity:0;animation:ring 1.4s ease-out 3.75s 2"/><text x="38.0" y="168.0" font-family="x-serif" font-size="62" fill="#FFFFFF" text-anchor="start" xml:space="preserve">B.Sc. </text><text x="150.8" y="168.0" font-family="x-serifi" font-size="62" fill="#FFFFFF" text-anchor="start" xml:space="preserve">EEE</text><text x="40.0" y="214.0" font-family="x-sans" font-size="19" fill="#FFFFFF" text-anchor="start" xml:space="preserve">Electrical and electronics engineer.</text><text x="40.0" y="241.0" font-family="x-sans" font-size="19" fill="#FFFFFF" text-anchor="start" xml:space="preserve">Arduino robotic hand, Raspberry Pis</text><text x="40.0" y="268.0" font-family="x-sans" font-size="19" fill="#FFFFFF" text-anchor="start" xml:space="preserve">over SPI, LiDAR.</text></g></g></svg>